# Corridor stack.
#
# WHY no local Postgres service: prod is Supabase managed Postgres and that
# is the single database — corridord reads DB_URL straight from .env (the
# Supabase transaction-pooler URL). Keeping a local `db` container here was a
# Phase-1 leftover and an active footgun: the committed override pointed
# corridord at the throwaway container, so a fresh clone / redeploy could
# silently write the odds-history moat to ephemeral storage. Redis stays as a
# local sidecar — it only holds live top-of-book and is safe to lose.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    # WHY no persistence: Redis only holds live top-of-book; Supabase is the
    # source of truth. Losing Redis loses nothing we can't repopulate on the
    # next quote poll.

  corridord:
    build: .
    restart: unless-stopped # prime directive: come back up, always
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # DB_URL is NOT overridden — it comes from .env (Supabase pooler), the
      # single source of truth. Only REDIS_URL is overridden, because the
      # cache is the sidecar container, reachable as `redis` on the compose
      # network (the .env value is localhost, for host-side tooling).
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PORT:-8080}:8080"
