services:
  db:
    # WHY the -ha image: it bundles TimescaleDB AND pgvector on pg16; the
    # plain timescaledb image lacks pgvector and would need a custom build.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: corridor
      POSTGRES_USER: corridor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corridor}
    ports:
      - "5432:5432"
    volumes:
      # WHY this path: the -ha image keeps its data under /home/postgres,
      # not the stock /var/lib/postgresql — mounting the wrong path means
      # silent data loss on container recreation.
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corridor -d corridor"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    # WHY no persistence: Redis only holds live top-of-book; Postgres is
    # the source of truth. Losing Redis loses nothing we can't repopulate
    # on the next quote poll.

  corridord:
    build: .
    restart: unless-stopped # prime directive: come back up, always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # In-network hostnames; these override the host-side values in .env,
      # which point at localhost for `make run` / `make migrate`.
      DB_URL: postgresql://postgres.orjccdkmnrrjqgqdhpau:tGhI3lIM066lwknB@aws-1-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PORT:-8080}:8080"

volumes:
  pgdata:
