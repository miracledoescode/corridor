[project]
name = "corridor-match"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "groq>=0.9",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# WHY pythonpath: tests import the `matcher` package from the match/ root
# rather than installing it, so pytest has to put match/ on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
