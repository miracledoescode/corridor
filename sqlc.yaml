version: "2"
sql:
  - engine: "postgresql"
    # WHY a separate schema file instead of pointing at migrations/: sqlc's
    # parser cannot evaluate TimescaleDB's create_hypertable() or the
    # pgvector column type, and none of our queries touch those anyway.
    # internal/store/schema.sql mirrors the migration minus those pieces;
    # migrations/ stays the single source of truth for the real database.
    schema: "internal/store/schema.sql"
    queries: "internal/store/queries"
    gen:
      go:
        package: "gen"
        out: "internal/store/gen"
        sql_package: "pgx/v5"
